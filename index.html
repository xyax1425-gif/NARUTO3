

<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#f97316">

<title>NARUTO版 ダブルチャンス</title>

<style>

:root{--a:#f97316;--b:#7c2d12;--c:#facc15}

*{box-sizing:border-box}

body{margin:0;min-height:100vh;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--a) 45%,transparent),transparent 36%),linear-gradient(145deg,#090914,#171329 55%,#080811);display:flex;align-items:center;justify-content:center;padding:22px;overflow-x:hidden}

body:before,body:after{content:"";position:fixed;width:65vw;height:65vw;border:2px solid color-mix(in srgb,var(--c) 35%,transparent);border-radius:50%;filter:blur(1px);animation:orbit 12s linear infinite;pointer-events:none}

body:after{width:85vw;height:85vw;animation-direction:reverse;animation-duration:18s}

@keyframes orbit{to{transform:rotate(360deg)}}

.card{position:relative;width:min(100%,480px);padding:28px 22px 30px;border:1px solid color-mix(in srgb,var(--c) 60%,white);border-radius:26px;background:linear-gradient(160deg,rgba(31,26,53,.96),rgba(7,8,20,.96));box-shadow:0 0 35px color-mix(in srgb,var(--a) 35%,transparent),inset 0 0 30px rgba(255,255,255,.04);text-align:center;z-index:1}

.tag{font-size:11px;letter-spacing:.2em;color:var(--c);font-weight:900}

h1{font-size:clamp(25px,7vw,36px);line-height:1.3;margin:13px 0 8px;text-shadow:0 0 18px color-mix(in srgb,var(--a) 80%,transparent)}

.sub{font-size:14px;color:#d8d5e8;line-height:1.7;margin:0 0 22px}

.emblem{margin:16px auto 20px;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,var(--c),var(--a) 42%,rgba(10,10,25,.15) 70%);box-shadow:0 0 25px var(--a),0 0 65px color-mix(in srgb,var(--a) 45%,transparent);font-size:22px;font-weight:1000;text-shadow:0 2px 8px #000;border:2px solid rgba(255,255,255,.65);animation:pulse 2s ease-in-out infinite}

@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 38px var(--c),0 0 85px var(--a)}}

.rule{font-size:13px;color:#d9d6e8;margin:0 0 20px}

#ticketNumber{width:100%;padding:16px;border-radius:12px;border:2px solid var(--c);font-size:20px;text-align:center;margin-bottom:15px;background:#fff;color:#222}

#ticketNumber::placeholder{color:#999}

button{width:100%;border:0;border-radius:999px;padding:17px 18px;font-size:18px;font-weight:900;color:#17101e;background:linear-gradient(100deg,var(--c),#fff0a6,var(--a));box-shadow:0 7px 0 color-mix(in srgb,var(--a) 65%,#111);cursor:pointer}

button:active{transform:translateY(4px);box-shadow:0 3px 0 color-mix(in srgb,var(--a) 65%,#111)}

button:disabled{opacity:.6;cursor:default}

.result{display:none;margin-top:22px;padding:22px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25)}

.result.show{display:block;animation:pop .55s cubic-bezier(.2,1.5,.5,1)}

@keyframes pop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}

.result h2{font-size:27px;margin:0 0 8px}

.result p{margin:0;color:#eee;line-height:1.7}

.small{font-size:11px;color:#aaa6bd;margin-top:20px}

.burst{position:fixed;inset:0;pointer-events:none;z-index:3;display:none;background:radial-gradient(circle,transparent 15%,color-mix(in srgb,var(--a) 35%,transparent) 70%);animation:flash .8s ease-out}

.burst.on{display:block}

@keyframes flash{0%{opacity:1}100%{opacity:0}}

</style>

</head>

<body>

<div class="burst" id="burst"></div>

<main class="card">

  <div class="tag">NINJA DOUBLE CHANCE</div>

  <h1>忍の運命をつかめ！</h1>

  <p class="sub">チャクラを解放して、景品をつかみ取れ！</p>

  <div class="emblem">火影の試練</div>

  <p class="rule">当選確率 <strong>15％</strong> ／ チャンスは1回だけ！</p>

  <input type="number" id="ticketNumber" placeholder="番号を入力してください">

  <button id="draw">運命の抽選をする！</button>

  <section class="result" id="result" aria-live="polite">

    <h2 id="resultTitle"></h2>

    <p id="resultText"></p>

  </section>

  <p class="small">この抽選は1回限りです。結果が出たら終了となります。</p>

</main>

<script>

const usedKey = "kuji_draw_used_naruto";

const button = document.getElementById("draw");

const result = document.getElementById("result");

const title = document.getElementById("resultTitle");

const text = document.getElementById("resultText");

const ticketNumber = document.getElementById("ticketNumber");

if (localStorage.getItem(usedKey) === "yes") {

  button.disabled = true;

  ticketNumber.disabled = true;

  button.textContent = "抽選は終了しています";

  title.textContent = "抽選済み";

  text.textContent = "この端末ではすでに抽選されています。";

  result.classList.add("show");

}

button.addEventListener("click", () => {

  if (localStorage.getItem(usedKey) === "yes") return;

  const number = ticketNumber.value.trim();

  if (!number) {

    alert("抽選番号を入力してください！");

    ticketNumber.focus();

    return;

  }

  button.disabled = true;

  ticketNumber.disabled = true;

  button.textContent = "抽選中…";

  const burst = document.getElementById("burst");

  burst.classList.add("on");

  setTimeout(() => {

    const win = Math.random() < 0.15;

    localStorage.setItem(usedKey, "yes");

    title.textContent = win ? "大当たり！景品GET！" : "今回ははずれ…";

    text.textContent = win

      ? "おめでとうございます！景品をお受け取りください！"

      : "参加ありがとう！またの挑戦をお待ちしています。";

    result.classList.add("show");

    button.textContent = "抽選終了";

    burst.classList.remove("on");

  }, 1700);

});

</script>

</body>

</html>
